name: Prepare Cargo release
description: Select the version and signed revision that every validation and publication job must use
inputs:
  token:
    required: true
    description: Authorized writer token (the release-writer GitHub App, minted per run and scoped to this repository); records the version commit on main
  breaking-change-bump:
    description: Bump level for breaking changes (major or minor); use minor only under an explicit pre-production release policy
    default: major
  plan-only:
    description: Calculate the release decision without writing a version commit or authorizing publication
    default: 'false'
  tag-format:
    description: Version tag spelling (semver or pep440); preserve the repository's existing release identity
    default: semver
outputs:
  major-approval-required:
    description: Whether the read-only plan needs an explicit major-release environment review
    value: ${{ steps.prepare.outputs.major_approval_required }}
  revision:
    description: Exact revision to test, build, tag and publish
    value: ${{ steps.prepare.outputs.revision }}
  version:
    description: Manifest release version
    value: ${{ steps.prepare.outputs.version }}
  release:
    description: Whether this main revision needs publication
    value: ${{ steps.prepare.outputs.release }}
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-version-info@1.0.0
    - id: prepare
      shell: bash
      env:
        RELEASE_APPROVAL_TOKEN: ${{ github.token }}
        RELEASE_BREAKING_CHANGE_BUMP: ${{ inputs.breaking-change-bump }}
        RELEASE_PLAN_ONLY: ${{ inputs.plan-only }}
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG_FORMAT: ${{ inputs.tag-format }}
        RELEASE_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$RELEASE_ACTION_PATH/release.py"
