name: Setup cargo-binstall
description: Install cargo-binstall for fast binary installations with caching

runs:
  using: composite
  steps:
    - name: Resolve latest cargo-binstall version
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # cargo-binstall is installed from GitHub Releases (not crates.io),
        # so resolve "latest" via the GitHub API and use the concrete tag in
        # the cache key. Otherwise the literal string "latest" pins runners
        # to whichever binary first populated the cache, masking new
        # releases for the cache lifetime.
        if [ -z "${GH_TOKEN:-}" ]; then
          printf 'GitHub token is required to resolve cargo-binstall\n' >&2
          exit 1
        fi
        if RELEASE_JSON=$(curl --fail-with-body --silent --show-error --location \
          -A "legra-ai-github-actions" \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/cargo-bins/cargo-binstall/releases/latest"); then
          if RESOLVED=$(printf '%s' "$RELEASE_JSON" | jq -er '.tag_name'); then
            if [[ ! "$RESOLVED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Invalid cargo-binstall release tag: %s\n' "$RESOLVED" >&2
              exit 1
            fi
          else
            printf 'GitHub release response has no cargo-binstall tag\n' >&2
            exit 1
          fi
        else
          printf 'Failed to resolve cargo-binstall from GitHub: %s\n' "$RELEASE_JSON" >&2
          exit 1
        fi
        printf 'version=%s\n' "$RESOLVED" >> "$GITHUB_OUTPUT" || exit 1
        printf 'cargo-binstall version: %s\n' "$RESOLVED" || exit 1

    - name: Cache cargo-binstall binary
      uses: actions/cache@v6
      id: cache-binstall
      with:
        path: ~/.cargo/bin/cargo-binstall${{ runner.os == 'Windows' && '.exe' || '' }}
        key: cargo-binstall-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install cargo-binstall if not cached
      if: steps.cache-binstall.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing cargo-binstall..."
        curl -sSfL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
          | sed 's/set -eux/set -eu/' \
          | bash
        echo "✓ cargo-binstall installed"

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Verify installation
      shell: bash
      run: cargo-binstall -V
