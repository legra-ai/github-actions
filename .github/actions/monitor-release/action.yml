name: Monitor release health
description: Verify public installation channels and keep an issue open until release recovery is proven
inputs:
  config:
    description: Path to the explicit repository and install-channel configuration
    required: true
  token:
    description: GitHub token with public repository read access and issues write in the monitoring repository
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_MONITOR_CONFIG: ${{ inputs.config }}
        RELEASE_MONITOR_ACTION: ${{ github.action_path }}
      run: python3 "$RELEASE_MONITOR_ACTION/release_monitor.py" monitor "$RELEASE_MONITOR_CONFIG"
