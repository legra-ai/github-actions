name: Merge tested dependencies
on:
  workflow_run:
    workflows: [Release action tests]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: merger
        with:
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MERGER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: ./.github/actions/merge-tested-dependabot
        with:
          token: ${{ steps.merger.outputs.token }}
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
