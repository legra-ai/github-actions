name: Cargo crate CI/CD

# Reusable workflow for cargo crates in the legra-ai organization.
# Caller workflow:
#
#   jobs:
#     ci:
#       uses: legra-ai/github-actions/.github/workflows/cargo-crate-ci.yml@main
#       with:
#         crate-name: my-crate
#         kind: binary       # or library (default)
#       secrets: inherit
#
# Pipeline: fmt -> clippy -> test (3 OS) -> version-check -> release ->
# (binary only) build-and-upload-binaries.

on:
  workflow_call:
    inputs:
      crate-name:
        description: "Crate name (must match [package].name and the binary name for kind=binary)"
        required: true
        type: string
      kind:
        description: "library (default) or binary; binary triggers cross-platform binary uploads"
        required: false
        type: string
        default: library
      test-threads:
        description: "If non-empty, pass --test-threads=N to cargo test (e.g. 1 for PTY-sensitive tests)"
        required: false
        type: string
        default: ""
      force-release:
        description: "Run the idempotent release pipeline even when the current version tag exists"
        required: false
        type: boolean
        default: false
    secrets:
      CRATES_IO_TOKEN:
        description: "Token used to publish the crate to crates.io"
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy
        run: cargo +nightly clippy --all-targets --all-features -- -D warnings -W missing-docs

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run tests
        shell: bash
        env:
          TEST_THREADS: ${{ inputs.test-threads }}
        run: |
          if [ -n "$TEST_THREADS" ]; then
            cargo test -- --test-threads="$TEST_THREADS"
          else
            cargo test
          fi
      - name: Run doc tests
        shell: bash
        run: |
          if cargo metadata --format-version 1 --no-deps | grep -q '"lib"'; then
            cargo test --doc
          else
            echo "Skipping doc tests: package has no library target"
          fi

  version-check:
    name: Check Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.force-release)
    outputs:
      version_changed: ${{ steps.gv.outputs.version_changed }}
      release_required: ${{ inputs.force-release || steps.gv.outputs.version_changed == 'true' }}
      new_version: ${{ steps.gv.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: legra-ai/github-actions/.github/actions/get-version@main
        id: gv

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, version-check]
    if: needs.version-check.outputs.release_required == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: legra-ai/github-actions/.github/actions/setup-cargo-binstall@main

      - uses: legra-ai/github-actions/.github/actions/setup-cocogitto@main

      - name: Create and push release tag
        env:
          VERSION: ${{ needs.version-check.outputs.new_version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag $TAG"
          fi

      - name: Generate changelog
        env:
          VERSION: ${{ needs.version-check.outputs.new_version }}
        run: cog changelog --at "v$VERSION" > CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-check.outputs.new_version }}
          name: v${{ needs.version-check.outputs.new_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Treats "already exists on crates.io" as success so the job is
      # safely re-runnable. See dotenvage commit 0e30aa3 for context.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.new_version }}
          CRATE: ${{ inputs.crate-name }}
        run: |
          rc=0
          LOG=$(cargo publish --allow-dirty 2>&1) || rc=$?
          echo "$LOG"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if echo "$LOG" | grep -q "already exists on crates.io"; then
            echo "ℹ️  $CRATE $VERSION already on crates.io, skipping"
            exit 0
          fi
          exit "$rc"

      - name: Release summary
        env:
          VERSION: ${{ needs.version-check.outputs.new_version }}
          CRATE: ${{ inputs.crate-name }}
        run: |
          echo "🎉 Successfully released v$VERSION"
          echo "📦 https://crates.io/crates/$CRATE"
          echo "📝 https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          echo "📚 https://docs.rs/$CRATE/$VERSION"

  build-and-upload-binaries:
    name: Build and Upload Binaries
    runs-on: ${{ matrix.platform.os }}
    needs: [release, version-check]
    if: inputs.kind == 'binary'
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version-check.outputs.new_version }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.platform.target }}
          cache: false  # Swatinem/rust-cache below for custom config

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Free disk space (Ubuntu)
        if: matrix.platform.os == 'ubuntu-24.04' || matrix.platform.os == 'ubuntu-24.04-arm'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Build and upload CLI binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ inputs.crate-name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.platform.target }}
          archive: $bin-$target
          checksum: sha256
          manifest_path: Cargo.toml
          ref: refs/tags/v${{ needs.version-check.outputs.new_version }}
          zip: "all"
