name: Tested Cargo maintenance
on:
  workflow_call:
    inputs:
      crate-name:
        description: Single package and binary name
        required: true
        type: string
      kind:
        description: library or binary
        default: library
        type: string
      policy-revision:
        description: Exact shared-actions commit used by the caller
        required: true
        type: string
    secrets:
      CRATES_IO_TOKEN:
        required: false
      RELEASE_WRITER_APP_ID:
        required: false
      RELEASE_WRITER_APP_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: cargo-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
      version: ${{ steps.manifest.outputs.version }}
      release: ${{ steps.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/github-actions
          ref: ${{ inputs.policy-revision }}
          path: .release-policy
          persist-credentials: false
      - name: Validate maintenance inputs
        env:
          POLICY_REVISION: ${{ inputs.policy-revision }}
          CRATE_KIND: ${{ inputs.kind }}
          RELEASE_CRATE: ${{ inputs.crate-name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['POLICY_REVISION']):
              raise ValueError('Policy revision must be an immutable commit')
          if os.environ['CRATE_KIND'] not in ('library', 'binary'):
              raise ValueError('Unsupported Cargo package kind')
          if tomllib.loads(Path('Cargo.toml').read_text())['package']['name'] != os.environ['RELEASE_CRATE']:
              raise ValueError('Maintenance package differs from manifest')
          PY
      - uses: actions/create-github-app-token@v3
        if: github.ref == 'refs/heads/main'
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-version-info@0.0.21
      - id: prepare
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token || github.token }}
        run: python3 .release-policy/.github/actions/prepare-cargo-release/release.py
      - id: manifest
        env:
          RELEASE_REVISION: ${{ steps.prepare.outputs.revision }}
        run: |
          git fetch origin "$RELEASE_REVISION" || exit 1
          python3 - <<'PY'
          import os, subprocess, tomllib
          raw = subprocess.check_output(['git', 'show', os.environ['RELEASE_REVISION'] + ':Cargo.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + tomllib.loads(raw)['package']['version'] + '\n')
          PY

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/github-actions
          ref: ${{ inputs.policy-revision }}
          path: .release-policy
          persist-credentials: false
      - id: formatter
        shell: bash
        run: |
          IFS= read -r toolchain < rustfmt-toolchain || exit 1
          printf 'toolchain=%s\n' "$toolchain" >> "$GITHUB_OUTPUT" || exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.formatter.outputs.toolchain }}
          components: rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sh scripts/fmt.sh --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - uses: ./.release-policy/.github/actions/test-cargo-package

  binary:
    needs: prepare
    if: inputs.kind == 'binary'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/github-actions
          ref: ${{ inputs.policy-revision }}
          path: .release-policy
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Build or recover the tested binary archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CRATE: ${{ inputs.crate-name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PUBLICATION: ${{ needs.prepare.outputs.release }}
        run: python3 .release-policy/.github/actions/build-tested-binary/binary.py build
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: binary-artifacts/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, test, binary]
    if: >-
      always() && needs.prepare.outputs.release == 'true' && needs.test.result == 'success' &&
      (needs.binary.result == 'success' || needs.binary.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          token: ${{ steps.writer.outputs.token }}
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/github-actions
          ref: ${{ inputs.policy-revision }}
          path: .release-policy
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: ./.release-policy/.github/actions/tag-tested-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.writer.outputs.token }}
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.revision }}
          draft: true
          generate_release_notes: true
      - uses: actions/download-artifact@v8
        if: inputs.kind == 'binary'
        with:
          pattern: binary-*
          merge-multiple: true
          path: binary-artifacts
      - name: Preserve binary installation archives
        if: inputs.kind == 'binary'
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          RELEASE_CRATE: ${{ inputs.crate-name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_TARGET: x86_64-unknown-linux-gnu
        run: python3 .release-policy/.github/actions/build-tested-binary/binary.py upload
      - uses: ./.release-policy/.github/actions/publish-tested-crate
        with:
          crate: ${{ inputs.crate-name }}
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - uses: ./.release-policy/.github/actions/test-cargo-package
        with:
          published: true
          revision: ${{ needs.prepare.outputs.revision }}
      - name: Complete verified release
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
