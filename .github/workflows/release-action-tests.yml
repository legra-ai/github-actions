name: Release action tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.89.0
      - run: uv run --no-project --python 3.13.18 python -m unittest discover -s tests
      - run: node --test tests/test_dependabot_merge.cjs tests/test_require_ci_success.cjs
  workflow-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub exposes the immutable defining workflow revision
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['JOB_WORKFLOW_SHA'] != os.environ['EXPECTED_REVISION']:
              raise ValueError('Native workflow identity differs from the executed revision')
          PY
  package-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.89.0
      - run: python3 -m unittest discover -s tests -p test_cargo_maintenance.py
      - run: python3 -m unittest discover -s tests -p test_package_features.py
      - run: python3 -m unittest discover -s tests -p test_commit_hook.py
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-version-info@1.0.13
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Exercise the public release preparation tool
        run: python3 -m unittest discover -s tests -p test_release_write.py
        env:
          RELEASE_TOOL_CONTRACT: '1'
