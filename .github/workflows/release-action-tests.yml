name: Release action tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.89.0
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/test_dependabot_merge.cjs
  workflow-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub exposes the immutable defining workflow revision
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['JOB_WORKFLOW_SHA'] != os.environ['EXPECTED_REVISION']:
              raise ValueError('Native workflow identity differs from the executed revision')
          PY
  package-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: 1.89.0
      - run: python3 -m unittest discover -s tests -p test_cargo_maintenance.py
      - run: python3 -m unittest discover -s tests -p test_package_features.py
      - run: python3 -m unittest discover -s tests -p test_commit_hook.py
