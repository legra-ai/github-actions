version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: UTC
    groups:
      compatible-updates:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, github-actions]
